name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kit-validator:
    name: Kit validator and self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (optional cross-check of frontmatter)
        run: python -m pip install pyyaml
      - name: Validate the kit
        run: python scripts/validate.py
      - name: Prove every rule fires on a planted defect
        run: python -m unittest discover -s scripts -p "test_*.py" -v

  claude-plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and plugin manifests
        run: |
          claude --version
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
      - name: Validate skills, agents and commands
        run: |
          for d in skills agents commands; do
            claude plugin validate "$d" --strict
          done
